<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>sw:loading</title>
<script>
// The title names the page (the URL fragment, "main" without one) and adds a
// token unique to this load, so run.sh can tell tabs apart by window title.
document.title = "sw:" + (location.hash.slice(1) || "main") + " " +
    Math.random().toString(36).slice(2, 8);
</script>
<style>
html, body { margin: 0; height: 100%; font: 16px sans-serif; }
.band { position: fixed; left: 0; width: 100%; height: 20%; display: block;
        box-sizing: border-box; border: 2px solid #888; margin: 0; font: inherit; }
#link { top: 0; }
#popup { top: 20%; }
#popup-plain { top: 40%; }
#blank { top: 60%; }
#context-link { top: 80%; }
</style>
</head>
<body>
<!-- Five bands, each a fifth of the page from the top; each opens this page
     with its own fragment, so the new tab's title names the band:
     a link (run.sh Shift+clicks it: a new window), a button that opens a
     400x300 pop-up window, a button that opens a pop-up without size or
     features, a target="_blank" link, and a link run.sh opens from its
     context menu ("Open Link in New Private Window"). -->
<a id="link" class="band" href="single-window-page.html#shift-click">Shift+click: open in a new window</a>
<button id="popup" class="band" type="button"
    onclick='window.open("single-window-page.html#popup", "_blank", "width=400,height=300")'>
    window.open() popup with a size</button>
<button id="popup-plain" class="band" type="button"
    onclick='window.open("single-window-page.html#popup-plain")'>
    window.open() popup without features</button>
<a id="blank" class="band" href="single-window-page.html#blank" target="_blank">target="_blank" link</a>
<a id="context-link" class="band" href="single-window-page.html#context-link">Link for the context menu</a>
</body>
</html>
