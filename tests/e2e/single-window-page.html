<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>sw:loading</title>
<script>
// The title names the page (the URL fragment, "main" without one) and adds a
// token unique to this load, so run.sh can tell tabs apart by window title.
document.title = "sw:" + (location.hash.slice(1) || "main") + " " +
    Math.random().toString(36).slice(2, 8);
</script>
<style>
html, body { margin: 0; height: 100%; font: 16px sans-serif; }
#link, #popup { position: fixed; left: 0; width: 100%; height: 50%; display: block;
                box-sizing: border-box; border: 2px solid #888; margin: 0; font: inherit; }
#link { top: 0; }
#popup { top: 50%; }
</style>
</head>
<body>
<!-- The top half of the page is a link (run.sh Shift+clicks it: a new window);
     the bottom half is a button that opens a 400x300 popup window. -->
<a id="link" href="single-window-page.html#shift-click">Shift+click: open in a new window</a>
<button id="popup" type="button"
    onclick='window.open("single-window-page.html#popup", "_blank", "width=400,height=300")'>
    window.open() popup</button>
</body>
</html>
