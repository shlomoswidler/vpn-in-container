<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>e2e cookie page</title>
<script>
// Says in the title which of its cookies the browser sent (e2e-<name>, sorted,
// or "none"), then sets e2e-<fragment> ("e2e-main" without one) for a day.
// run.sh loads it over HTTP from inside the container's network
// (torrent_server.py): across a container restart on the same /config, and
// in a normal and a private window, which keep separate cookies.
const names = document.cookie.split("; ")
    .map(cookie => cookie.split("=")[0])
    .filter(name => name.startsWith("e2e-"))
    .sort();
document.cookie = "e2e-" + (location.hash.slice(1) || "main") +
    "=kept; max-age=86400; path=/; SameSite=Lax";
document.title = "e2e cookie page cookies=" + (names.join(",") || "none");
</script>
</head>
<body></body>
</html>
