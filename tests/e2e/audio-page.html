<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>e2e audio page</title>
<style>
html, body { margin: 0; height: 100%; font: 16px sans-serif; }
#toggle { position: fixed; inset: 0; width: 100%; border: 2px solid #888; }
</style>
</head>
<body>
<!-- A click (from run.sh, a real user gesture, so Firefox's autoplay block lets it
     through) plays a 1000 Hz sine on the left channel and a 1500 Hz sine on the right,
     each at amplitude 0.25, and sets the title to "audio-playing state=<AudioContext
     state> rate=<sample rate>". The next click stops both and sets "audio-stopped".
     Any failure sets "audio-error <message>". -->
<button id="toggle">Play a test tone</button>
<script>
"use strict";
const LEFT_HZ = 1000;
const RIGHT_HZ = 1500;
const AMPLITUDE = 0.25;
let context = null;

async function play() {
    context = new AudioContext();
    const merger = new ChannelMergerNode(context, { numberOfInputs: 2 });
    for (const [hz, channel] of [[LEFT_HZ, 0], [RIGHT_HZ, 1]]) {
        const oscillator = new OscillatorNode(context, { type: "sine", frequency: hz });
        const gain = new GainNode(context, { gain: AMPLITUDE });
        oscillator.connect(gain).connect(merger, 0, channel);
        oscillator.start();
    }
    merger.connect(context.destination);
    await context.resume();
    document.title = `audio-playing state=${context.state} rate=${context.sampleRate}`;
}

async function stop() {
    await context.close();
    context = null;
    document.title = "audio-stopped";
}

document.getElementById("toggle").addEventListener("click", () => {
    (context ? stop() : play()).catch((error) => {
        document.title = `audio-error ${error.message}`;
    });
});
</script>
</body>
</html>
