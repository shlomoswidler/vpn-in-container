# Docker API allowlist for autoheal (willfarrell/docker-autoheal): list containers, and
# restart one by its full ID. Every other request gets 403, including container inspect
# (which shows every container's environment), attach, exec, create, stop and kill.
# Mounted over the linuxserver/socket-proxy image's /templates/haproxy.cfg; its entrypoint
# replaces @@BIND_PROTO@@ and writes the result to /run/haproxy/haproxy.cfg.
# The paths are matched as sent (not URL-decoded): an encoded variant does not match the
# anchored patterns, so it is denied.
global
    log stdout format raw daemon "${LOG_LEVEL}"
    pidfile /run/haproxy.pid
    user root
    maxconn 100

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option http-server-close
    timeout http-request 10s
    timeout connect 10s
    timeout client 2m
    timeout server 2m
    maxconn 100

backend docker
    server socket $SOCKET_PATH

frontend proxy
    bind @@BIND_PROTO@@
    # Healthchecks
    http-request allow if METH_GET { path -m reg ^(/v[0-9.]+)?/_ping$ }
    # Autoheal's query for unhealthy containers with its label
    http-request allow if METH_GET { path -m reg ^(/v[0-9.]+)?/containers/json$ }
    # Autoheal's restart of one container, by full ID (not by name)
    http-request allow if METH_POST { path -m reg ^(/v[0-9.]+)?/containers/[0-9a-f]{64}/restart$ }
    http-request deny
    default_backend docker
