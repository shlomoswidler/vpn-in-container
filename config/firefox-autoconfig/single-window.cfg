// single-window.cfg: keeps Firefox to one browser window of each kind, adds a Window menu and Quit & Restart (autoconfig; the first line must be a comment).
// Mounted at /usr/lib/firefox/single-window.cfg and loaded by autoconfig.js.
// A window is normal or private, and Firefox moves no tab between the two kinds, so there is at
// most one normal and one private window. When any later browser window finishes starting (a
// menu item, a shift-click, "Open in New Window", "Move to New Window", an extension), its tabs
// move into the oldest open window of the same kind, once their pages have started loading
// (see pagesSaved below). Moving a window's last tab closes that
// window (tabbrowser's adoptTab), so one window of that kind remains. The first window of a kind
// stays. Nothing here closes a window: a tab adoptTab does not move stays where it is.
// Every window is maximized and undecorated (Openbox, which has no key bindings here), so
// nothing else switches windows. Firefox has a Window menu only on macOS; this adds one to the
// menu bar (Alt+W): it lists the windows and shows the chosen one. Ctrl+` shows the next window
// (Control, not Alt: a Mac keeps Command+` and Alt+Tab is the computer's own on others).
// With permanent private browsing every window is private, so there is only one: no Window
// menu, no Ctrl+` and no Close Window (its File menu item is hidden, Ctrl+Shift+W disabled).
// Firefox quitting, or closing its last window, does not stop the container: the image starts
// Firefox again (KEEP_APP_RUNNING=1). Quit is Quit & Restart here (Ctrl+Q, the File and main
// menus), and asks first. Ctrl+Alt+Shift+Q quits without asking, for the container's shutdown
// script (config/firefox-services/kill), as the image's own presses Ctrl+Q.
try {
    const { PrivateBrowsingUtils } = ChromeUtils.importESModule(
        "resource://gre/modules/PrivateBrowsingUtils.sys.mjs"
    );
    // The open browser windows, oldest first, without CLOSING (a window being closed).
    const browserWindows = (closing) => Array.from(Services.wm.getEnumerator("navigator:browser"))
        .filter(w => w !== closing && !w.closed && w.gBrowser);
    // Read when a window starts: the image writes the pref into prefs.js, which Firefox reads
    // after this file runs.
    const privateOnly = () => PrivateBrowsingUtils.permanentPrivateBrowsing;
    const RESUME_ONCE = "browser.sessionstore.resume_session_once";

    // Asks, then quits through Firefox's own Quit (which the image answers by starting Firefox
    // again). Without permanent private browsing the next start reopens the tabs, as Firefox's
    // own restart does; a private session is never kept.
    const quitAndRestart = (win, event) => {
        const text = privateOnly()
            ? "Firefox will close every tab, forget this session's cookies, history and site " +
              "data, and start again."
            : "Firefox will close and start again, reopening your tabs. Private windows are " +
              "not reopened, and their cookies, history and site data are forgotten.";
        const prompt = Services.prompt;
        const flags = prompt.BUTTON_POS_0 * prompt.BUTTON_TITLE_IS_STRING +
            prompt.BUTTON_POS_1 * prompt.BUTTON_TITLE_CANCEL;
        // In a button's label, "&" marks the next character as its access key ("&&" is a
        // plain "&"), so "Quit & Restart" would show as "Quit Restart" with Space underlined.
        if (prompt.confirmEx(win, "Quit & Restart", text, flags, "Quit && Restart", null, null,
            null, {}) !== 0) {
            return;
        }
        if (!privateOnly()) {
            Services.prefs.setBoolPref(RESUME_ONCE, true);
        }
        if (!win.goQuitApplication(event)) {
            // Something else (a download in progress) stopped the quit.
            Services.prefs.clearUserPref(RESUME_ONCE);
        }
    };

    // Quit & Restart in the main menu, before its (hidden) Quit. The menu's contents are made
    // the first time it opens. The menu stays open while its item's command runs, and while
    // it is open its keyboard navigation takes every key first (Return chooses the selected
    // item again), so the question would never get the answer: it is asked once the menu
    // has closed.
    const addAppMenuItem = (win) => {
        const doc = win.document;
        const quit = doc.getElementById("appMenu-quit-button2");
        if (!quit || doc.getElementById("single-window-appmenu-restart")) {
            return;
        }
        const item = doc.createXULElement("toolbarbutton");
        item.id = "single-window-appmenu-restart";
        item.className = "subviewbutton";
        item.setAttribute("label", "Quit & Restart");
        item.setAttribute("key", "single-window-key-quit");
        item.addEventListener("command", (event) => {
            const panel = win.PanelUI.panel;
            if (panel.state === "closed" || doc.documentElement.hasAttribute("customizing")) {
                quitAndRestart(win, event);
                return;
            }
            const onHidden = (hidden) => {
                if (hidden.target === panel) {
                    panel.removeEventListener("popuphidden", onHidden);
                    quitAndRestart(win, event);
                }
            };
            panel.addEventListener("popuphidden", onHidden);
            win.PanelUI.hide();
        });
        quit.before(item);
    };

    // Shows the browser window after WIN (the first one after the last).
    const switchFrom = (win) => {
        const windows = browserWindows(null);
        const next = windows[(windows.indexOf(win) + 1) % windows.length];
        if (next && next !== win) {
            next.focus();
        }
    };

    // The Window menu: one item per browser window, oldest first (numbered, which are also
    // their access keys; the current one checked), Next Window and Close Window.
    const fillWindowMenu = (win, popup) => {
        const doc = win.document;
        popup.replaceChildren();
        browserWindows(null).forEach((w, index) => {
            const item = doc.createXULElement("menuitem");
            item.setAttribute("type", "radio");
            item.setAttribute("label", `${index + 1} ${w.document.title}`);
            item.setAttribute("accesskey", `${index + 1}`);
            if (w === win) {
                item.setAttribute("checked", "true");
            }
            item.addEventListener("command", () => w.focus());
            popup.append(item);
        });
        popup.append(doc.createXULElement("menuseparator"));
        const next = doc.createXULElement("menuitem");
        next.setAttribute("label", "Next Window");
        next.setAttribute("accesskey", "N");
        next.setAttribute("key", "single-window-key-next");
        if (browserWindows(null).length < 2) {
            next.setAttribute("disabled", "true");
        }
        next.addEventListener("command", () => switchFrom(win));
        popup.append(next);
        const close = doc.createXULElement("menuitem");
        close.setAttribute("label", "Close Window");
        close.setAttribute("accesskey", "C");
        close.setAttribute("command", "cmd_closeWindow");
        close.setAttribute("key", "key_closeWindow");
        popup.append(close);
    };

    // A key works only in a keyset added to the document after it (Gecko sets keys up when
    // their keyset is bound), so these keys get their own keyset.
    const addKeys = (win, keys) => {
        const doc = win.document;
        const keyset = doc.createXULElement("keyset");
        for (const [id, character, modifiers, action] of keys) {
            const key = doc.createXULElement("key");
            key.id = id;
            key.setAttribute("key", character);
            key.setAttribute("modifiers", modifiers);
            key.addEventListener("command", action);
            keyset.append(key);
        }
        doc.documentElement.append(keyset);
    };

    // Quit & Restart (Ctrl+Q, File and main menus) and the shutdown key, in every window.
    const addQuitControls = (win) => {
        const doc = win.document;
        const item = doc.createXULElement("menuitem");
        item.id = "single-window-file-restart";
        item.setAttribute("label", "Quit & Restart");
        item.setAttribute("accesskey", "Q");
        item.setAttribute("key", "single-window-key-quit");
        item.addEventListener("command", (event) => quitAndRestart(win, event));
        doc.getElementById("menu_FileQuitItem").before(item);
        doc.addEventListener("popupshowing", () => addAppMenuItem(win), true);
        addKeys(win, [
            ["single-window-key-quit", "Q", "accel", (event) => quitAndRestart(win, event)],
            ["single-window-key-shutdown", "Q", "accel,alt,shift",
                (event) => win.goQuitApplication(event)],
        ]);
    };

    const addWindowControls = (win) => {
        const doc = win.document;
        const menu = doc.createXULElement("menu");
        menu.id = "single-window-menu";
        menu.setAttribute("label", "Window");
        menu.setAttribute("accesskey", "W");
        const popup = doc.createXULElement("menupopup");
        popup.addEventListener("popupshowing", () => fillWindowMenu(win, popup));
        menu.append(popup);
        doc.getElementById("main-menubar").insertBefore(menu, doc.getElementById("helpMenu"));
        addKeys(win, [["single-window-key-next", "`", "control", () => switchFrom(win)]]);
    };

    // With permanent private browsing: no Close Window (there is only one window).
    const removeCloseWindow = (win) => {
        win.document.getElementById("menu_closeWindow").hidden = true;
        win.goSetCommandEnabled("cmd_closeWindow", false);
    };

    // A window opened for a link (a shift-click, "Open Link in New Window") finishes starting
    // before its page has loaded. Moving a tab (adoptTab) hands its page to a new browser, and
    // the session store goes on filing what that page saves under the key the new browser had
    // before tabbrowser swaps the two browsers' keys, which leaves with the closed window: a tab
    // moved before its page was saved has nothing saved and is not reopened after a restart.
    // So a later window's tabs move once each has a page in its session history (or its load
    // has stopped, as for a download) and the session store has collected them.
    const { TabStateFlusher } = ChromeUtils.importESModule(
        "resource:///modules/sessionstore/TabStateFlusher.sys.mjs"
    );
    const { STATE_STOP, STATE_IS_NETWORK } = Ci.nsIWebProgressListener;
    const pagesSaved = (win) => new Promise((resolve) => {
        const stopped = new WeakSet();
        const ready = () => Array.from(win.gBrowser.tabs).every((tab) => {
            const history = tab.linkedBrowser.browsingContext?.sessionHistory;
            return !history || history.count > 0 || stopped.has(tab.linkedBrowser);
        });
        const listener = {
            onLocationChange: () => check(),
            onStateChange: (browser, progress, _request, flags) => {
                if (progress.isTopLevel && (flags & STATE_STOP) && (flags & STATE_IS_NETWORK)) {
                    stopped.add(browser);
                    check();
                }
            },
        };
        const done = () => {
            win.gBrowser.removeTabsProgressListener(listener);
            win.removeEventListener("unload", done);
            resolve();
        };
        const check = () => {
            if (ready()) {
                done();
            }
        };
        win.gBrowser.addTabsProgressListener(listener);
        win.addEventListener("unload", done);
        check();
    }).then(() => (win.closed ? undefined : TabStateFlusher.flushWindow(win)));

    Services.obs.addObserver((newWindow) => {
        const isPrivate = PrivateBrowsingUtils.isWindowPrivate(newWindow);
        const firstWindow = () => browserWindows(newWindow).find(w =>
            PrivateBrowsingUtils.isWindowPrivate(w) === isPrivate);
        const addControls = () => {
            if (newWindow.closed) {
                return;
            }
            addQuitControls(newWindow);
            if (privateOnly()) {
                removeCloseWindow(newWindow);
            } else {
                addWindowControls(newWindow);
            }
        };
        if (!firstWindow()) {
            addControls();
            return;
        }
        pagesSaved(newWindow).then(() => {
            const main = firstWindow();
            if (main && !newWindow.closed) {
                const tabs = Array.from(newWindow.gBrowser.tabs);
                for (const tab of tabs) {
                    if (!main.gBrowser.adoptTab(tab, { selectTab: tab.selected })) {
                        Services.console.logStringMessage(
                            "single-window.cfg: a tab could not move into the first window; its window stays"
                        );
                    }
                }
                main.focus();
            }
            addControls();
        }).catch((e) => Services.console.logStringMessage(`single-window.cfg: ${e}`));
    }, "browser-delayed-startup-finished");
} catch (e) {
    Services.console.logStringMessage(`single-window.cfg: ${e}`);
}
