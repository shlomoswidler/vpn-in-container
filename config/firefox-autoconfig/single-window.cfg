// single-window.cfg: keeps Firefox to one browser window of each kind, and adds a Window menu (autoconfig; the first line must be a comment).
// Mounted at /usr/lib/firefox/single-window.cfg and loaded by autoconfig.js.
// A window is normal or private, and Firefox moves no tab between the two kinds, so there is at
// most one normal and one private window. When any later browser window finishes starting (a
// menu item, a shift-click, "Open in New Window", "Move to New Window", an extension), its tabs
// move into the oldest open window of the same kind. Moving a window's last tab closes that
// window (tabbrowser's adoptTab), so one window of that kind remains. The first window of a kind
// stays. Nothing here closes a window: a tab adoptTab does not move stays where it is.
// Every window is maximized and undecorated (Openbox, which has no key bindings here), so
// nothing else switches windows. Firefox has a Window menu only on macOS; this adds one to the
// menu bar (Alt+W): it lists the windows and shows the chosen one. Ctrl+` shows the next window
// (Control, not Alt: a Mac keeps Command+` and Alt+Tab is the computer's own on others). Close
// Window (Ctrl+Shift+W, the File and Window menus) works while another browser window is open;
// on the last one it is disabled, since closing that window would stop the container.
try {
    const { PrivateBrowsingUtils } = ChromeUtils.importESModule(
        "resource://gre/modules/PrivateBrowsingUtils.sys.mjs"
    );
    // The open browser windows, oldest first, without CLOSING (a window being closed).
    const browserWindows = (closing) => Array.from(Services.wm.getEnumerator("navigator:browser"))
        .filter(w => w !== closing && !w.closed && w.gBrowser);

    // Close Window (cmd_closeWindow: its key and menu items) only while another window is open.
    const updateCloseWindow = (closing) => {
        const windows = browserWindows(closing);
        for (const w of windows) {
            w.goSetCommandEnabled("cmd_closeWindow", windows.length > 1);
        }
    };

    // Shows the browser window after WIN (the first one after the last).
    const switchFrom = (win) => {
        const windows = browserWindows(null);
        const next = windows[(windows.indexOf(win) + 1) % windows.length];
        if (next && next !== win) {
            next.focus();
        }
    };

    // The Window menu: one item per browser window, oldest first (numbered, which are also
    // their access keys; the current one checked), Next Window and Close Window.
    const fillWindowMenu = (win, popup) => {
        const doc = win.document;
        popup.replaceChildren();
        browserWindows(null).forEach((w, index) => {
            const item = doc.createXULElement("menuitem");
            item.setAttribute("type", "radio");
            item.setAttribute("label", `${index + 1} ${w.document.title}`);
            item.setAttribute("accesskey", `${index + 1}`);
            if (w === win) {
                item.setAttribute("checked", "true");
            }
            item.addEventListener("command", () => w.focus());
            popup.append(item);
        });
        popup.append(doc.createXULElement("menuseparator"));
        const next = doc.createXULElement("menuitem");
        next.setAttribute("label", "Next Window");
        next.setAttribute("accesskey", "N");
        next.setAttribute("key", "single-window-key-next");
        if (browserWindows(null).length < 2) {
            next.setAttribute("disabled", "true");
        }
        next.addEventListener("command", () => switchFrom(win));
        popup.append(next);
        const close = doc.createXULElement("menuitem");
        close.setAttribute("label", "Close Window");
        close.setAttribute("accesskey", "C");
        close.setAttribute("command", "cmd_closeWindow");
        close.setAttribute("key", "key_closeWindow");
        popup.append(close);
    };

    const addWindowControls = (win) => {
        const doc = win.document;
        const menu = doc.createXULElement("menu");
        menu.id = "single-window-menu";
        menu.setAttribute("label", "Window");
        menu.setAttribute("accesskey", "W");
        const popup = doc.createXULElement("menupopup");
        popup.addEventListener("popupshowing", () => fillWindowMenu(win, popup));
        menu.append(popup);
        doc.getElementById("main-menubar").insertBefore(menu, doc.getElementById("helpMenu"));
        // A key works only in a keyset added to the document after it (Gecko sets keys up when
        // their keyset is bound), so it gets its own keyset.
        const keyset = doc.createXULElement("keyset");
        const key = doc.createXULElement("key");
        key.id = "single-window-key-next";
        key.setAttribute("key", "`");
        key.setAttribute("modifiers", "control");
        key.addEventListener("command", () => switchFrom(win));
        keyset.append(key);
        doc.documentElement.append(keyset);
    };

    Services.obs.addObserver((newWindow) => {
        const isPrivate = PrivateBrowsingUtils.isWindowPrivate(newWindow);
        const main = browserWindows(newWindow).find(w =>
            PrivateBrowsingUtils.isWindowPrivate(w) === isPrivate);
        if (main) {
            const tabs = Array.from(newWindow.gBrowser.tabs);
            for (const tab of tabs) {
                if (!main.gBrowser.adoptTab(tab, { selectTab: tab.selected })) {
                    Services.console.logStringMessage(
                        "single-window.cfg: a tab could not move into the first window; its window stays"
                    );
                }
            }
            main.focus();
        }
        if (!newWindow.closed) {
            addWindowControls(newWindow);
        }
        updateCloseWindow(null);
    }, "browser-delayed-startup-finished");
    Services.ww.registerNotification((subject, topic) => {
        if (topic === "domwindowclosed") {
            updateCloseWindow(subject);
        }
    });
} catch (e) {
    Services.console.logStringMessage(`single-window.cfg: ${e}`);
}
