// single-window.cfg: keeps Firefox to one browser window (autoconfig; the first line must be a comment).
// Mounted at /usr/lib/firefox/single-window.cfg and loaded by autoconfig.js.
// When any second browser window finishes starting (a menu item, a shift-click, "Open in New
// Window", "Move to New Window", an extension), its tabs move into the first window. Moving a
// window's last tab closes that window (tabbrowser's adoptTab), so one window remains.
// Firefox moves no tab between a private and a normal window (adoptTab refuses), so a window
// whose privacy differs from the first one's is closed instead. That is a private window when
// private browsing is off (FIREFOX_PRIVATE_BROWSING); with it on, every window is private.
try {
    const { PrivateBrowsingUtils } = ChromeUtils.importESModule(
        "resource://gre/modules/PrivateBrowsingUtils.sys.mjs"
    );
    Services.obs.addObserver((newWindow) => {
        const windows = Array.from(Services.wm.getEnumerator("navigator:browser"));
        const main = windows.find(w => w !== newWindow && !w.closed && w.gBrowser);
        if (!main) {
            return;
        }
        if (PrivateBrowsingUtils.isWindowPrivate(newWindow) !==
            PrivateBrowsingUtils.isWindowPrivate(main)) {
            Services.console.logStringMessage(
                "single-window.cfg: closed a window whose privacy differs from the first one's"
            );
            newWindow.close();
            main.focus();
            return;
        }
        const tabs = Array.from(newWindow.gBrowser.tabs);
        for (const tab of tabs) {
            main.gBrowser.adoptTab(tab, { selectTab: tab.selected });
        }
        main.focus();
    }, "browser-delayed-startup-finished");
} catch (e) {
    Services.console.logStringMessage(`single-window.cfg: ${e}`);
}
