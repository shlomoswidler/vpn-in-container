// single-window.cfg: keeps Firefox to one browser window of each kind (autoconfig; the first line must be a comment).
// Mounted at /usr/lib/firefox/single-window.cfg and loaded by autoconfig.js.
// A window is normal or private, and Firefox moves no tab between the two kinds, so there is at
// most one normal and one private window. When any later browser window finishes starting (a
// menu item, a shift-click, "Open in New Window", "Move to New Window", an extension), its tabs
// move into the oldest open window of the same kind. Moving a window's last tab closes that
// window (tabbrowser's adoptTab), so one window of that kind remains. The first window of a kind
// stays. Nothing here closes a window: a tab adoptTab does not move stays where it is.
try {
    const { PrivateBrowsingUtils } = ChromeUtils.importESModule(
        "resource://gre/modules/PrivateBrowsingUtils.sys.mjs"
    );
    Services.obs.addObserver((newWindow) => {
        const isPrivate = PrivateBrowsingUtils.isWindowPrivate(newWindow);
        const windows = Array.from(Services.wm.getEnumerator("navigator:browser"));
        const main = windows.find(w => w !== newWindow && !w.closed && w.gBrowser &&
            PrivateBrowsingUtils.isWindowPrivate(w) === isPrivate);
        if (!main) {
            return;
        }
        const tabs = Array.from(newWindow.gBrowser.tabs);
        for (const tab of tabs) {
            if (!main.gBrowser.adoptTab(tab, { selectTab: tab.selected })) {
                Services.console.logStringMessage(
                    "single-window.cfg: a tab could not move into the first window; its window stays"
                );
            }
        }
        main.focus();
    }, "browser-delayed-startup-finished");
} catch (e) {
    Services.console.logStringMessage(`single-window.cfg: ${e}`);
}
