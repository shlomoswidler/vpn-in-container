services:
  # ===========================================
  # VPN Container - All traffic routes through this
  # ===========================================
  vpn:
    # Latest release. :latest is a development build of every master push; wait for v3.42
    # (it requires control-server auth on all routes and migrates config/gluetun/servers.json).
    # Pinned by tag and digest; upgrade deliberately and run tests/stack/run.sh.
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun-vpn
    cap_add:
      - NET_ADMIN
    devices:
      - /dev/net/tun:/dev/net/tun
    ports:
      # Firefox noVNC Web GUI
      - "5800:5800"
      # qBittorrent Web UI
      - "9080:9080"
    environment:
      # ProtonVPN with WireGuard
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # Server selection
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Netherlands}
      # Port forwarding for better torrent connectivity
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # Control server for qSticky
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      # Our auth file (API key roles for qSticky) is config/gluetun/config.toml, mounted at
      # /gluetun/config.toml; Gluetun's default path is /gluetun/auth/config.toml, which would
      # leave every route unauthenticated.
      - HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH=/gluetun/config.toml
      # Firewall/Kill switch
      - FIREWALL=on
      # Timezone
      - TZ=${TZ:-America/New_York}
    volumes:
      - ./config/gluetun:/gluetun
    labels:
      # Opt-in marker for this project's autoheal instance (see autoheal service).
      # Scopes autoheal to these siblings only, never other stacks on this host.
      - "autoheal=true"
    restart: always
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================
  # Firefox Browser with noVNC
  # ===========================================
  firefox:
    # Pinned: config/novnc/cursor.js and config/cursors/ are built against this version.
    # Re-check both before upgrading (see config/cursors/README.md).
    image: jlesage/firefox:v26.09.1@sha256:302aa068dcfa46a2d248771c998f67377383554df8940252caef42b99c13eb65
    container_name: firefox-novnc
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    environment:
      # User/Group IDs
      - "USER_ID=${PUID:?Set PUID in .env (run: id -u)}"
      - "GROUP_ID=${PGID:?Set PGID in .env (run: id -g)}"
      # Display settings
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      # No password protection
      - WEB_AUTHENTICATION=0
      # Timezone
      - TZ=${TZ:-America/New_York}
      # Dark mode
      - DARK_MODE=1
      # Always use private browsing mode. FF_PREF_* values are <pref name>=<value>:
      # the image splits on the first "=" (tests/e2e/run.sh checks every FF_PREF_* entry).
      - FF_PREF_PRIVATE_BROWSING=browser.privatebrowsing.autostart=true
      # Load config/firefox-chrome/userChrome.css (mounted below)
      - FF_PREF_USERCHROME=toolkit.legacyUserProfileCustomizations.stylesheets=true
      # Single window: a tab dropped outside the tab strip stays put. Firefox would otherwise
      # un-maximize the window (only tab) or open a new one (see config/firefox-autoconfig/).
      - FF_PREF_TAB_DETACH=browser.tabs.allowTabDetach=false
      # Pages' window.open() popups open as tabs, and pages can't move or resize windows
      - FF_PREF_POPUPS_IN_TABS=browser.link.open_newwindow.restriction=0
      - FF_PREF_NO_WINDOW_MOVE_RESIZE=dom.disable_window_move_resize=true
      # Marker cursor theme (mounted below): each cursor names a CSS cursor keyword, and the
      # patched noVNC shows the viewer's own native cursor for it (see config/cursors/README.md).
      # The size must match NOMINAL_SIZE in config/cursors/generate_native_theme.py.
      - XCURSOR_THEME=native-css
      - XCURSOR_SIZE=24
    volumes:
      # Firefox configuration persistence
      - ./config/firefox:/config:rw
      # Download folder (also serves as qBittorrent watch folder for .torrent handoff)
      - ${DOWNLOADS_PATH:-${HOME}/Downloads/vpn-in-container}/downloads:/config/downloads:rw
      # Firefox policies (force-installs Torrent Control extension)
      - ./config/firefox-policies/policies.json:/etc/firefox/policies/policies.json:ro
      # Marker cursor theme (generated by config/cursors/generate_native_theme.py)
      - ./config/cursors/native-css:/usr/share/icons/native-css:ro
      # noVNC cursor patch: shows the viewer's native cursor for native-css marker cursors
      - ./config/novnc/cursor.js:/opt/noVNC/core/util/cursor.js:ro
      - ./config/novnc/cursor-keyword.js:/opt/noVNC/core/util/cursor-keyword.js:ro
      # Openbox's 1-bit cursors, matched to native ones (generated by config/novnc/core-glyphs/capture.sh)
      - ./config/novnc/core-glyphs.js:/opt/noVNC/core/util/core-glyphs.js:ro
      # Removes Openbox's 1px top border, whose unthemed cursor shows along the top edge
      - ./config/firefox-init.d/57-openbox-no-keepborder.sh:/etc/cont-init.d/57-openbox-no-keepborder.sh:ro
      # No window dragging from toolbars: Openbox would show its 1-bit move cursor
      - ./config/firefox-chrome/userChrome.css:/config/profile/chrome/userChrome.css:ro
      # Removes Openbox's Alt+drag move/resize bindings (1-bit cursors; Alt+Right unmaximizes)
      - ./config/firefox-init.d/58-openbox-no-alt-drag.sh:/etc/cont-init.d/58-openbox-no-alt-drag.sh:ro
      # Single window: moves the tabs of any new browser window into the first one
      - ./config/firefox-autoconfig/autoconfig.js:/usr/lib/firefox/defaults/pref/autoconfig.js:ro
      - ./config/firefox-autoconfig/single-window.cfg:/usr/lib/firefox/single-window.cfg:ro
      # Single window: clears Ctrl+N, Ctrl+Shift+P, Ctrl+Shift+N and Ctrl+Shift+W (Ctrl+Q stays:
      # the image's shutdown script sends it)
      - ./config/firefox-profile/customKeys.json:/config/profile/customKeys.json:ro
    shm_size: "2gb"
    labels:
      # Opt-in marker for this project's autoheal instance (see autoheal service).
      # Scopes autoheal to these siblings only, never other stacks on this host.
      - "autoheal=true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- --timeout=5 http://localhost:5800 > /dev/null 2>&1 && wget -qO- --timeout=5 https://1.1.1.1 > /dev/null 2>&1"]
      interval: 60s
      timeout: 15s
      retries: 3
      start_period: 90s

  # ===========================================
  # qBittorrent Torrent Client
  # ===========================================
  qbittorrent:
    # Pinned by tag and digest; upgrade deliberately and run tests/stack/run.sh.
    # 5.3.0 with libtorrent 2.1.2 (the _v2.1.2 part of the tag). The short 5.3.0 tag does not
    # pin libtorrent. Downgrading loses the WebUI password (5.1 can't read the [WebUI] section).
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
    container_name: qbittorrent
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    environment:
      - "PUID=${PUID:?Set PUID in .env (run: id -u)}"
      - "PGID=${PGID:?Set PGID in .env (run: id -g)}"
      - TZ=${TZ:-America/New_York}
      - WEBUI_PORT=9080
    volumes:
      # qBittorrent configuration
      - ./config/qbittorrent:/config
      # Custom init scripts (disables WebUI auth for private networks)
      - ./config/qbittorrent-init.d:/custom-cont-init.d:ro
      # Completed downloads (mapped to host folder)
      - ${DOWNLOADS_PATH:-${HOME}/Downloads/vpn-in-container}:/downloads
      # Watch folder for auto-adding .torrent files (shared with Firefox downloads)
      - ${DOWNLOADS_PATH:-${HOME}/Downloads/vpn-in-container}/downloads:/watch
    labels:
      # Opt-in marker for this project's autoheal instance (see autoheal service).
      # Scopes autoheal to these siblings only, never other stacks on this host.
      - "autoheal=true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 5 http://localhost:9080/api/v2/app/version && curl -sf --max-time 5 https://1.1.1.1 > /dev/null"]
      interval: 30s
      timeout: 15s
      retries: 3
      start_period: 90s

  # ===========================================
  # qSticky - Automatic Port Forwarding Sync
  # ===========================================
  qsticky:
    # Pinned by tag and digest; upgrade deliberately and run tests/stack/run.sh.
    image: ghcr.io/monstermuffin/qsticky:2.4.3@sha256:27c19a7acc9fb8b39c2b5ebee3183190a3920afbb1c43342b01c7752c02a02d3
    container_name: qsticky
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
      qbittorrent:
        condition: service_healthy
        restart: true
    environment:
      # qBittorrent connection (localhost since we share VPN network)
      - QBITTORRENT_HOST=localhost
      - QBITTORRENT_PORT=9080
      - QBITTORRENT_USER=admin
      - QBITTORRENT_PASS=${QBITTORRENT_PASS:-adminadmin}
      - QBITTORRENT_HTTPS=false
      # Gluetun connection (localhost since we share VPN network)
      - GLUETUN_HOST=localhost
      - GLUETUN_PORT=8000
      - GLUETUN_AUTH_TYPE=apikey
      - GLUETUN_APIKEY=${GLUETUN_API_KEY}
      # Check interval
      - CHECK_INTERVAL=30
      - LOG_LEVEL=INFO
    labels:
      # Opt-in marker for this project's autoheal instance (see autoheal service).
      # Scopes autoheal to these siblings only, never other stacks on this host.
      - "autoheal=true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/8000) 2>/dev/null && (echo > /dev/tcp/localhost/9080) 2>/dev/null || exit 1'"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

  # ===========================================
  # Autoheal - Restarts unhealthy containers
  # ===========================================
  autoheal:
    # No version tags: the project rebuilds :latest daily. Pinned to a build by digest.
    # Pinned by tag and digest; upgrade deliberately and run tests/stack/run.sh.
    image: willfarrell/autoheal:latest@sha256:c4227b7a25b8ef08829ad3ad440af3a821e4277c9b1b2050a3f671ad9d87bfc6
    container_name: autoheal
    restart: always
    network_mode: none
    environment:
      # Only heal containers labelled `autoheal=true` (this project's services).
      # `all` would restart every unhealthy container on the host, including
      # containers belonging to unrelated Docker Compose projects.
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
      - TZ=${TZ:-America/New_York}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
