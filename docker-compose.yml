# Log rotation for every service (each refers to this with `logging: *logging`).
# Explicit, because the daemon's default differs per host: OrbStack rotates json-file logs
# (20 MB x 5), a stock Docker Engine keeps them without limit. json-file is Docker's default
# driver, so the files stay where and how log tools expect them; `docker logs` reads the
# rotated files too. At most 30 MB per container. The busiest is the socket proxy, which logs
# Autoheal's poll every 10 seconds: about 3 MB a day, so 9 days kept. A change applies to a
# container when it is next created.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  # ===========================================
  # VPN Container - All traffic routes through this
  # ===========================================
  vpn:
    # Latest release. :latest is a development build of every master push; wait for v3.42
    # (it requires control-server auth on all routes and migrates config/gluetun/servers.json).
    # Pinned by tag and digest; upgrade deliberately and run tests/stack/run.sh.
    image: qmcgaw/gluetun:v3.41.3@sha256:fa19cc76b2af13d57a8d3dc3066f2ada061b1c761b8aecf989b3877c0486e027
    container_name: gluetun-vpn
    logging: *logging
    # Every capability is dropped, and each service adds back only what its image was
    # measured to need (tests/test_compose.py lists the sets; each one missing breaks
    # something, as noted). Gluetun runs as root:
    cap_drop:
      - ALL
    cap_add:
      # Routes, firewall rules (iptables over nftables) and the WireGuard interface
      - NET_ADMIN
      # The ICMP health check's raw socket; without it Gluetun falls back to DNS checks for good
      - NET_RAW
    # Gluetun's status files, /tmp/gluetun/forwarded_port and /tmp/gluetun/ip: v3.41.3 makes
    # the directory with mode 0644 (no search bit), so root would need DAC_OVERRIDE to create
    # a file in it (without it, no port is forwarded). Gluetun keeps an existing directory as
    # it is. Emptied at each start; Gluetun writes both files once the tunnel is up.
    tmpfs:
      - /tmp/gluetun:mode=0755
    # No setuid, setgid or file-capability binary can raise a process's privileges. Each
    # image's init starts as root and drops to its user with syscalls, which this allows.
    security_opt:
      - no-new-privileges:true
    # Limits, so a runaway process (a fork loop, a leak) stops in its own container instead
    # of slowing the host. Each is set well above the peak measured (cgroup memory.peak and
    # pids.peak, which counts threads) while tests/stack/run.sh and tests/e2e/run.sh ran:
    # an out-of-memory kill restarts the container, which normal use must never cause.
    # Gluetun: 97 MiB, 29 tasks.
    pids_limit: 256
    mem_limit: 512m
    # No read-only root: at start Gluetun writes /etc/resolv.conf (nameserver 127.0.0.1, its
    # DNS server, for every container here), and with a PUID other than 0 it adds that user
    # to /etc/passwd.
    devices:
      - /dev/net/tun:/dev/net/tun
    # Loopback only: neither web UI has a password. Without a host IP, Docker binds every
    # interface (IPv4 and IPv6) and OrbStack forwards the ports to the LAN.
    ports:
      # Firefox noVNC Web GUI
      - "127.0.0.1:5800:5800"
      # qBittorrent Web UI
      - "127.0.0.1:9080:9080"
    environment:
      # Owner of the status files above (nothing reads them: qSticky asks the control server).
      # Not a process user: Gluetun runs as root either way, and WireGuard runs inside it.
      # With the default, 1000, Gluetun needs CHOWN to hand the files over and DAC_OVERRIDE to
      # rewrite them (v3.42 also FOWNER, to chmod them). Not .env's PUID, which is for the
      # services behind it.
      - PUID=0
      - PGID=0
      # ProtonVPN with WireGuard
      - VPN_SERVICE_PROVIDER=protonvpn
      - VPN_TYPE=wireguard
      - WIREGUARD_PRIVATE_KEY=${WIREGUARD_PRIVATE_KEY}
      # Server selection
      - SERVER_COUNTRIES=${SERVER_COUNTRIES:-Netherlands}
      # Port forwarding for better torrent connectivity
      - VPN_PORT_FORWARDING=on
      - VPN_PORT_FORWARDING_PROVIDER=protonvpn
      # Control server for qSticky
      - HTTP_CONTROL_SERVER_ADDRESS=:8000
      # qSticky's role, which Compose writes from .env (configs: gluetun_auth, below). Not
      # Gluetun's default, /gluetun/auth/config.toml: /gluetun is the ./config/gluetun bind
      # mount, and Compose would write the key into that host folder.
      - HTTP_CONTROL_SERVER_AUTH_CONFIG_FILEPATH=/run/secrets/gluetun_auth.toml
      # Firewall/Kill switch
      - FIREWALL=on
      # Timezone
      - TZ=${TZ:-America/New_York}
    volumes:
      # Gluetun's server list (servers.json), which it rewrites at start
      - ./config/gluetun:/gluetun
    # Copied in by Compose each time it starts the container (up and start, not restart), as
    # root's and readable only by root. Compose does not recreate a container when only the
    # content changes: a new GLUETUN_API_KEY reaches Gluetun only with
    # `docker compose up -d --force-recreate vpn qsticky` (README.md, Changing the API Key).
    configs:
      - source: gluetun_auth
        target: /run/secrets/gluetun_auth.toml
        mode: 0400
    labels:
      # Opt-in marker for this project's autoheal instance (see autoheal service).
      # Scopes autoheal to these siblings only, never other stacks on this host.
      - "autoheal=true"
    # Every service uses unless-stopped: Docker restarts a container that exits, and after a
    # reboot or a Docker restart it starts those that were running, but not after
    # `docker compose stop`. With `always` on only some services, a stopped stack came back
    # after a reboot as the VPN (and Autoheal) alone, with the web UI ports leading nowhere.
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "/gluetun-entrypoint", "healthcheck"]
      interval: 15s
      timeout: 10s
      retries: 3
      start_period: 60s

  # ===========================================
  # Firefox Browser with noVNC
  # ===========================================
  firefox:
    # Pinned: config/novnc/cursor.js and config/cursors/ are built against this version.
    # Re-check both before upgrading (see config/cursors/README.md).
    image: jlesage/firefox:v26.09.1@sha256:302aa068dcfa46a2d248771c998f67377383554df8940252caef42b99c13eb65
    container_name: firefox-novnc
    logging: *logging
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    environment:
      # User/Group IDs
      - "USER_ID=${PUID:?Set PUID in .env (run: id -u)}"
      - "GROUP_ID=${PGID:?Set PGID in .env (run: id -g)}"
      # Display settings
      - DISPLAY_WIDTH=1920
      - DISPLAY_HEIGHT=1080
      # No password protection
      - WEB_AUTHENTICATION=0
      # Timezone
      - TZ=${TZ:-America/New_York}
      # Dark mode
      - DARK_MODE=1
      # Sound in the web UI (the image's default is 0: pages play without sound). The image
      # runs PulseAudio for Firefox and streams its output over the web UI's port 5800
      # (/websockify-audio, raw 44.1 kHz stereo, about 1.4 Mbit/s): turn it on once with the
      # speaker icon in the side panel. Not for VNC clients. It needs nothing beyond the
      # hardening below (measured: PulseAudio and the recorder run as the app user with no
      # capabilities and write only under /tmp and /config).
      - WEB_AUDIO=1
      # Always use private browsing mode. FF_PREF_* values are <pref name>=<value>:
      # the image splits on the first "=" (tests/e2e/run.sh checks every FF_PREF_* entry).
      - FF_PREF_PRIVATE_BROWSING=browser.privatebrowsing.autostart=true
      # Load config/firefox-chrome/userChrome.css (mounted below)
      - FF_PREF_USERCHROME=toolkit.legacyUserProfileCustomizations.stylesheets=true
      # Single window: a tab dropped outside the tab strip stays put. Firefox would otherwise
      # un-maximize the window (only tab) or open a new one (see config/firefox-autoconfig/).
      - FF_PREF_TAB_DETACH=browser.tabs.allowTabDetach=false
      # Pages' window.open() popups open as tabs, and pages can't move or resize windows
      - FF_PREF_POPUPS_IN_TABS=browser.link.open_newwindow.restriction=0
      # Closing the last tab (Ctrl+W) opens a new one instead of closing the window, whose
      # end would stop the container. The image's firefox-branding.js sets the same, but the
      # single window must not depend on an image default (Firefox's own is true). While the
      # two agree, Firefox leaves the line out when it rewrites prefs.js; the image writes it
      # again at every start.
      - FF_PREF_KEEP_WINDOW_WITH_LAST_TAB=browser.tabs.closeWindowWithLastTab=false
      - FF_PREF_NO_WINDOW_MOVE_RESIZE=dom.disable_window_move_resize=true
      # WebRTC never offers a page this container's addresses (eth0's on the Docker network,
      # tun0's in the tunnel), only what STUN servers see: the VPN's exit address. Firefox
      # already does that for most pages, but not for one that uses the camera or microphone
      # (a video call): it gets every interface's real address. default_address_only gathers
      # on the default route's interface (tun0) only; no_host keeps its address out of the
      # offer too. The reflexive (STUN) and relay candidates are still offered: a peer outside
      # the VPN could reach only those anyway (tests/e2e/run.sh scenario 8).
      - FF_PREF_WEBRTC_DEFAULT_ADDRESS=media.peerconnection.ice.default_address_only=true
      - FF_PREF_WEBRTC_NO_HOST=media.peerconnection.ice.no_host=true
      # Marker cursor theme (mounted below): each cursor names a CSS cursor keyword, and the
      # patched noVNC shows the viewer's own native cursor for it (see config/cursors/README.md).
      # The size must match NOMINAL_SIZE in config/cursors/generate_native_theme.py.
      - XCURSOR_THEME=native-css
      - XCURSOR_SIZE=24
    volumes:
      # Firefox configuration persistence
      - ./config/firefox:/config:rw
      # Download folder (also serves as qBittorrent watch folder for .torrent handoff).
      # DOWNLOADS_PATH defaults to ${HOME}/Downloads/vpn-in-container here and below;
      # .env.example and the README document the same default.
      - ${DOWNLOADS_PATH:-${HOME}/Downloads/vpn-in-container}/downloads:/config/downloads:rw
      # Firefox policies (force-installs Torrent Control extension)
      - ./config/firefox-policies/policies.json:/etc/firefox/policies/policies.json:ro
      # Marker cursor theme (generated by config/cursors/generate_native_theme.py)
      - ./config/cursors/native-css:/usr/share/icons/native-css:ro
      # noVNC cursor patch: shows the viewer's native cursor for native-css marker cursors.
      # The image's file plus config/novnc/cursor.js.patch; the browser and e2e tests fail
      # if the image's own file is no longer the one recorded (config/cursors/README.md).
      - ./config/novnc/cursor.js:/opt/noVNC/core/util/cursor.js:ro
      - ./config/novnc/cursor-keyword.js:/opt/noVNC/core/util/cursor-keyword.js:ro
      # Openbox's 1-bit cursors, matched to native ones (generated by config/novnc/core-glyphs/capture.sh)
      - ./config/novnc/core-glyphs.js:/opt/noVNC/core/util/core-glyphs.js:ro
      # Removes Openbox's 1px top border, whose unthemed cursor shows along the top edge
      - ./config/firefox-init.d/57-openbox-no-keepborder.sh:/etc/cont-init.d/57-openbox-no-keepborder.sh:ro
      # No window dragging from toolbars: Openbox would show its 1-bit move cursor
      - ./config/firefox-chrome/userChrome.css:/config/profile/chrome/userChrome.css:ro
      # Removes Openbox's Alt+drag move/resize bindings (1-bit cursors; Alt+Right unmaximizes)
      - ./config/firefox-init.d/58-openbox-no-alt-drag.sh:/etc/cont-init.d/58-openbox-no-alt-drag.sh:ro
      # Single window: moves the tabs of any new browser window into the first one
      - ./config/firefox-autoconfig/autoconfig.js:/usr/lib/firefox/defaults/pref/autoconfig.js:ro
      - ./config/firefox-autoconfig/single-window.cfg:/usr/lib/firefox/single-window.cfg:ro
      # Single window: clears Ctrl+N, Ctrl+Shift+P, Ctrl+Shift+N and Ctrl+Shift+W (Ctrl+Q stays:
      # the image's shutdown script sends it)
      - ./config/firefox-profile/customKeys.json:/config/profile/customKeys.json:ro
    shm_size: "2gb"
    # Read-only root filesystem, as the image supports: it writes at run time only to /config
    # (mounted above; the image links /var/tmp and /var/log there), /tmp, /run and /dev/shm.
    read_only: true
    tmpfs:
      - /tmp
      - /run
    # See vpn. The init runs as root, creates the app user and hands it /config, then
    # starts each service as that user.
    cap_drop:
      - ALL
    cap_add:
      # chown of /etc/shadow, /config and the runtime directories (the init stops without it)
      - CHOWN
      # Root writing into the app user's files and directories (prefs.js, /tmp, /run/openbox)
      - DAC_OVERRIDE
      # chmod of /config/var/tmp, which the app user owns after the first start
      - FOWNER
      # Starting each service as the app user
      - SETUID
      - SETGID
      # The supervisor checks and stops the app user's processes with signals
      - KILL
      # nginx carries this as a file capability, and the kernel refuses to run it unless the
      # capability is allowed. no-new-privileges keeps nginx from gaining it (the web UI is on
      # 5800, and Docker sets net.ipv4.ip_unprivileged_port_start=0).
      - NET_BIND_SERVICE
    security_opt:
      - no-new-privileges:true  # see vpn
    # See vpn. Firefox runs a process per site: 20 tabs of busy sites (news, video, maps)
    # peaked at 4.3 GiB and 1,311 tasks, against 0.5 GiB and 234 tasks with one tab. Its
    # /dev/shm (shm_size, a tmpfs) also counts against mem_limit when used (0 here, even at
    # 20 tabs). An out-of-memory kill would close every tab.
    pids_limit: 4096
    mem_limit: 8g
    labels:
      # Opt-in marker for this project's autoheal instance (see autoheal service).
      # Scopes autoheal to these siblings only, never other stacks on this host.
      - "autoheal=true"
    restart: unless-stopped
    # Healthy = the web UI answers and the VPN's network is still live: Gluetun's control
    # server (port 8000) listens only in the live shared network. If the Gluetun container
    # restarts, this container is left on its old, dead network and fails within ~30s, and
    # Autoheal restarts it. No internet check: a VPN outage is Gluetun's to detect, and
    # restarting this container would not fix it (it would only close the open tabs).
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null --timeout=3 http://localhost:5800 && nc -z -w 3 127.0.0.1 8000 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 5s

  # ===========================================
  # qBittorrent Torrent Client
  # ===========================================
  qbittorrent:
    # Pinned by tag and digest; upgrade deliberately and run tests/stack/run.sh.
    # 5.3.0 with libtorrent 2.1.2 (the _v2.1.2 part of the tag). The short 5.3.0 tag does not
    # pin libtorrent. Downgrading loses the WebUI password (5.1 can't read the [WebUI] section).
    image: lscr.io/linuxserver/qbittorrent:5.3.0_v2.1.2-ls485@sha256:75ecbb1c89ab7b0a21c4bde40b4820e4f1649d2d56d83b91913422155e8d2a5f
    container_name: qbittorrent
    logging: *logging
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
    environment:
      - "PUID=${PUID:?Set PUID in .env (run: id -u)}"
      - "PGID=${PGID:?Set PGID in .env (run: id -g)}"
      - TZ=${TZ:-America/New_York}
      - WEBUI_PORT=9080
    # See vpn. s6 runs as root, sets up the abc user (PUID), and runs qBittorrent as abc.
    cap_drop:
      - ALL
    cap_add:
      # lsiown of /config and /downloads (without it qBittorrent cannot write /config)
      - CHOWN
      # Root writing the abc user's files: the image's init and
      # config/qbittorrent-init.d (qBittorrent.conf)
      - DAC_OVERRIDE
      # s6-setuidgid abc
      - SETUID
      - SETGID
      # s6 passing SIGTERM on to qBittorrent: without it Docker kills qBittorrent at the stop
      # timeout, before it saves its resume data
      - KILL
    security_opt:
      - no-new-privileges:true  # see vpn
    # See vpn. 313 MiB, 37 tasks, seeding 2 of 19 torrents (53 GiB). The cached pages of the
    # files it reads count too, but the kernel frees those under the limit.
    pids_limit: 512
    mem_limit: 2g
    # No read-only root: in read-only mode this image ignores PUID/PGID and runs qBittorrent
    # as 911:1001, so it could not use files owned by PUID (measured: /config/qBittorrent
    # became 911:1001, and the image says "the PUID/PGID environment variables will have no
    # effect").
    volumes:
      # qBittorrent configuration
      - ./config/qbittorrent:/config
      # Custom init scripts (disables WebUI auth for private networks)
      - ./config/qbittorrent-init.d:/custom-cont-init.d:ro
      # Completed downloads (mapped to host folder)
      - ${DOWNLOADS_PATH:-${HOME}/Downloads/vpn-in-container}:/downloads
      # Watch folder for auto-adding .torrent files (shared with Firefox downloads)
      - ${DOWNLOADS_PATH:-${HOME}/Downloads/vpn-in-container}/downloads:/watch
    labels:
      # Opt-in marker for this project's autoheal instance (see autoheal service).
      # Scopes autoheal to these siblings only, never other stacks on this host.
      - "autoheal=true"
    restart: unless-stopped
    # Healthy = the WebUI API answers and the VPN's network is still live (Gluetun's
    # control server, port 8000); see the firefox service. No internet check: restarting
    # qBittorrent would not fix a VPN outage, only interrupt torrents.
    healthcheck:
      test: ["CMD-SHELL", "curl -sf --max-time 3 http://localhost:9080/api/v2/app/version > /dev/null && nc -z -w 3 127.0.0.1 8000 > /dev/null 2>&1"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 90s
      start_interval: 5s

  # ===========================================
  # qSticky - Automatic Port Forwarding Sync
  # ===========================================
  qsticky:
    # Pinned by tag and digest; upgrade deliberately and run tests/stack/run.sh.
    image: ghcr.io/monstermuffin/qsticky:2.4.3@sha256:27c19a7acc9fb8b39c2b5ebee3183190a3920afbb1c43342b01c7752c02a02d3
    container_name: qsticky
    logging: *logging
    network_mode: service:vpn
    depends_on:
      vpn:
        condition: service_healthy
        restart: true
      qbittorrent:
        condition: service_healthy
        restart: true
    environment:
      # qBittorrent connection (localhost since we share VPN network)
      - QBITTORRENT_HOST=localhost
      - QBITTORRENT_PORT=9080
      # qSticky always logs in, but over loopback qBittorrent answers without checking the
      # credentials (LocalHostAuth=false, set by the init script), so these only matter if
      # that is turned off. Then QBITTORRENT_PASS in .env must be the WebUI password: each
      # wrong login counts, and qBittorrent bans 127.0.0.1 for an hour after 5. Nothing sets
      # qBittorrent's password from it. Empty when unset (adminadmin, qSticky's own default,
      # has not been qBittorrent's since 4.6.1).
      - QBITTORRENT_USER=admin
      - QBITTORRENT_PASS=${QBITTORRENT_PASS:-}
      - QBITTORRENT_HTTPS=false
      # Gluetun connection (localhost since we share VPN network)
      - GLUETUN_HOST=localhost
      - GLUETUN_PORT=8000
      - GLUETUN_AUTH_TYPE=apikey
      - "GLUETUN_APIKEY=${GLUETUN_API_KEY:?Set GLUETUN_API_KEY in .env (run: openssl rand -hex 32)}"
      # Check interval
      - CHECK_INTERVAL=30
      - LOG_LEVEL=INFO
    # See vpn. Runs as root and writes only root's files (/app/health): needs no capability.
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true  # see vpn
    # See vpn. Python: 85 MiB, 9 tasks.
    pids_limit: 64
    mem_limit: 256m
    # Read-only root filesystem: qSticky writes only its health file, in /app/health.
    read_only: true
    tmpfs:
      - /app/health
    labels:
      # Opt-in marker for this project's autoheal instance (see autoheal service).
      # Scopes autoheal to these siblings only, never other stacks on this host.
      - "autoheal=true"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "bash -c '(echo > /dev/tcp/localhost/8000) 2>/dev/null && (echo > /dev/tcp/localhost/9080) 2>/dev/null || exit 1'"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 120s
      start_interval: 5s

  # ===========================================
  # Autoheal - Restarts unhealthy containers
  # ===========================================
  autoheal:
    # willfarrell/docker-autoheal, built here: one POSIX sh script (docker-entrypoint, MIT
    # license) at a fixed commit, on a digest-pinned Alpine with curl, jq and tzdata. Upstream
    # has no version tags; its Hub image is :latest, rebuilt daily on Alpine 3.18 (end of
    # life), and old digests lose their tag. README.md (Autoheal's image) says how to update it.
    # The tag names the commit, the Alpine version and its digest: change it with them, or
    # `docker compose up -d` keeps using the image built from the old ones.
    image: vpn-in-container/autoheal:f535158-alpine3.24.3-be2656061b53
    # Never pulled, only built: `docker compose up -d` builds it when it is missing (the
    # first build fetches the commit from GitHub), and plain `docker compose pull` skips it.
    pull_policy: never
    build:
      context: https://github.com/willfarrell/docker-autoheal.git#f535158fbafcc34b2329249b5eaa1f3224cf9a32
      # Not upstream's Dockerfile, which fetches an unpinned BuildKit frontend
      # (`# syntax = docker/dockerfile:latest`) and builds on alpine:3.18. The script sets a
      # default for every variable that Dockerfile sets in ENV.
      dockerfile_inline: |
        FROM alpine:3.24.3@sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
        RUN apk add --no-cache curl jq tzdata
        COPY --chmod=0755 docker-entrypoint /docker-entrypoint
        ENTRYPOINT ["/docker-entrypoint"]
        CMD ["autoheal"]
      # What it was built from (tests/stack/run.sh compares these with the running image's).
      labels:
        org.opencontainers.image.source: https://github.com/willfarrell/docker-autoheal
        org.opencontainers.image.revision: f535158fbafcc34b2329249b5eaa1f3224cf9a32
        org.opencontainers.image.base.name: alpine:3.24.3
        org.opencontainers.image.base.digest: sha256:be2656061b536c1883c4034790e21d0a09c5aaaf51968b89368a3c0371ea2c9a
    container_name: autoheal
    logging: *logging
    # unless-stopped, like every service (see vpn).
    restart: unless-stopped
    # As nobody, with no capabilities and a read-only root: the script only runs curl and
    # jq, talks to the proxy over the network and writes no file.
    user: "65534:65534"
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true  # see vpn
    # See vpn. sh, curl and jq: 14 MiB, 8 tasks (through tests/stack/run.sh and both
    # tests/stack/recovery.sh scenarios, which restart three services in a row).
    pids_limit: 64
    mem_limit: 64m
    # No Docker socket: autoheal reaches the Docker API only through autoheal-proxy, on an
    # internal network with no route out.
    networks:
      - autoheal-docker
    depends_on:
      autoheal-proxy:
        condition: service_healthy
    environment:
      - DOCKER_SOCK=tcp://autoheal-proxy:2375
      # Only heal containers labeled `autoheal=true` (this project's services).
      # `all` would restart every unhealthy container on the host, including
      # containers belonging to unrelated Docker Compose projects.
      - AUTOHEAL_CONTAINER_LABEL=autoheal
      - AUTOHEAL_INTERVAL=10
      - AUTOHEAL_START_PERIOD=120
      - AUTOHEAL_DEFAULT_STOP_TIMEOUT=30
      # Seconds curl waits for Docker's answer, a restart's included: a restart waits up to
      # the stop timeout for the container to stop, then starts it. At the default (30, the
      # same as the stop timeout), a restart that needed the whole stop timeout went through
      # but was logged as "Restarting container ... failed". It must stay below the proxy's
      # `timeout server` (2m, config/autoheal-proxy/haproxy.cfg).
      - CURL_TIMEOUT=90
      # Log times in local time (the image has tzdata)
      - TZ=${TZ:-America/New_York}
    # Healthy = the call Autoheal makes every interval, the container list, gets through the
    # proxy to Docker. (The script is PID 1: the container runs only while it does.)
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS --max-time 5 -o /dev/null \"http://$${DOCKER_SOCK#tcp://}/containers/json?limit=1\""]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
      start_interval: 2s

  # ===========================================
  # Autoheal's Docker socket proxy
  # ===========================================
  autoheal-proxy:
    # HAProxy in front of the Docker socket. config/autoheal-proxy/haproxy.cfg replaces the
    # image's template: only GET /_ping, GET /containers/json and
    # POST /containers/<64-hex ID>/restart reach the daemon; everything else gets 403.
    # No CONTAINERS/ALLOW_RESTARTS env on purpose: if the template mount stopped being
    # used, the image's defaults would deny container access and autoheal would fail visibly.
    # Pinned by tag and digest; upgrade deliberately and run tests/stack/run.sh.
    image: lscr.io/linuxserver/socket-proxy:3.4.7-r0-ls104@sha256:4e5e59efd3338205561c54262581992036e5a36ccca97d487b1d4ec41f9adc58
    container_name: autoheal-proxy
    logging: *logging
    # unless-stopped, like every service (see vpn).
    restart: unless-stopped
    # Root inside, with no capabilities: the socket's group differs per host (root on
    # OrbStack, docker on Linux). The entrypoint writes its rendered config to /run.
    read_only: true
    tmpfs:
      - /run
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    # See vpn. HAProxy starts a thread per CPU (16 here): 34 MiB, 24 tasks.
    pids_limit: 256
    mem_limit: 128m
    environment:
      - LOG_LEVEL=info
    volumes:
      # Read-only stops writes to the socket file, not API calls: the allowlist limits those.
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - ./config/autoheal-proxy/haproxy.cfg:/templates/haproxy.cfg:ro
    networks:
      - autoheal-docker
    # No autoheal label: autoheal restarts through this proxy, so it cannot heal it.
    # The restart policy brings HAProxy back if it exits.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:2375/_ping"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
      start_interval: 2s

networks:
  # Only autoheal and its proxy: no route out, nothing published.
  autoheal-docker:
    internal: true

# Gluetun's control-server roles, written from .env: GLUETUN_API_KEY is the only copy of the key
# (qSticky gets it in its environment). With it, qSticky may read the forwarded port and the
# VPN status, nothing else: no settings (they include the WireGuard private key) and no PUT.
# The key goes into a TOML string, so it must not contain " or \ (openssl rand -hex 32 never
# does).
configs:
  gluetun_auth:
    content: |
      [[roles]]
      name = "qsticky"
      routes = ["GET /v1/portforward", "GET /v1/vpn/status"]
      auth = "apikey"
      apikey = "${GLUETUN_API_KEY:?Set GLUETUN_API_KEY in .env (run: openssl rand -hex 32)}"
